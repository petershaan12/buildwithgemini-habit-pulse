<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#064E3B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="32" cy="34" r="26" fill="url(#glowGrad)" />

  <!-- Cute Sprout Leaf Stem -->
  <path d="M32 20 Q32 10 40 8 Q44 14 34 21 Z" fill="url(#leafGrad)" filter="url(#shadow)" />
  <path d="M32 20 Q30 12 24 10 Q21 16 30 21 Z" fill="url(#leafGrad)" />

  <!-- Mascot Body (Chibi Round Bean / Boba Sprout) -->
  <ellipse cx="32" cy="37" rx="20" ry="18" fill="url(#bodyGrad)" filter="url(#shadow)" />

  <!-- Highlight Shine -->
  <ellipse cx="26" cy="27" rx="5" ry="3" fill="#FFFFFF" opacity="0.4" transform="rotate(-20 26 27)" />

  <!-- Big Expressive Eyes -->
  <ellipse cx="25" cy="36" rx="3" ry="4" fill="#064E3B" />
  <circle cx="24" cy="34.5" r="1.3" fill="#FFFFFF" />
  
  <ellipse cx="39" cy="36" rx="3" ry="4" fill="#064E3B" />
  <circle cx="38" cy="34.5" r="1.3" fill="#FFFFFF" />

  <!-- Rosy Cheeks -->
  <ellipse cx="20" cy="40" rx="2.5" ry="1.5" fill="#F43F5E" opacity="0.6" />
  <ellipse cx="44" cy="40" rx="2.5" ry="1.5" fill="#F43F5E" opacity="0.6" />

  <!-- Happy Smile -->
  <path d="M29 40 Q32 44 35 40" stroke="#064E3B" stroke-width="2" stroke-linecap="round" fill="none" />
</svg>
